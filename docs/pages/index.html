<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Legal | BrainChip Connect</title>
    <meta
      name="description"
      content="The published legal documents for BrainChip Connect."
    />
    <style>
      :root {
        color-scheme: light dark;
        --page: #f8f8f9;
        --surface: #ffffff;
        --ink: #14181b;
        --ink-soft: #4c565e;
        --brand: #0061ed;
        --edge: #e2e6ea;
        --banner: #eef4ff;
      }

      @media (prefers-color-scheme: dark) {
        :root {
          --page: #0e1216;
          --surface: #161b21;
          --ink: #eef1f4;
          --ink-soft: #a7b1ba;
          --brand: #5fa0ff;
          --edge: #262e36;
          --banner: #15233a;
        }
      }

      * {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        padding: 48px 16px 96px;
        background: var(--page);
        color: var(--ink);
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto,
          'Helvetica Neue', Arial, sans-serif;
        font-size: 17px;
        line-height: 1.6;
      }

      main {
        max-width: 720px;
        margin: 0 auto;
      }

      .eyebrow {
        margin: 0;
        color: var(--brand);
        font-size: 15px;
        font-weight: 600;
        letter-spacing: 0.06em;
        text-transform: uppercase;
      }

      h1 {
        margin: 8px 0 4px;
        font-size: 38px;
        line-height: 1.15;
        letter-spacing: -0.02em;
      }

      .updated {
        margin: 0 0 40px;
        color: var(--ink-soft);
        font-size: 15px;
      }

      .banner {
        margin: 0 0 40px;
        padding: 24px;
        border: 1px solid var(--edge);
        border-left: 4px solid var(--brand);
        border-radius: 12px;
        background: var(--banner);
      }

      .banner h2 {
        margin: 0 0 8px;
        font-size: 19px;
      }

      .banner p {
        margin: 0;
      }

      section {
        margin: 0 0 20px;
        padding: 28px;
        border: 1px solid var(--edge);
        border-radius: 12px;
        background: var(--surface);
      }

      section h2 {
        margin: 0;
        font-size: 23px;
        letter-spacing: -0.01em;
      }

      section > p {
        margin: 12px 0 0;
        color: var(--ink-soft);
      }

      ul {
        margin: 20px 0 0;
        padding: 0;
        list-style: none;
      }

      li + li {
        margin-top: 18px;
        padding-top: 18px;
        border-top: 1px solid var(--edge);
      }

      li h3 {
        margin: 0;
        font-size: 17px;
        font-weight: 600;
      }

      li p {
        margin: 6px 0 0;
        color: var(--ink-soft);
      }

      footer {
        margin-top: 40px;
        color: var(--ink-soft);
        font-size: 15px;
        text-align: center;
      }

      @media (max-width: 540px) {
        body {
          padding: 32px 16px 64px;
        }

        h1 {
          font-size: 30px;
        }

        section {
          padding: 20px;
        }
      }

      .documents {
        display: grid;
        gap: 16px;
      }

      .documents a {
        display: block;
        padding: 28px;
        border: 1px solid var(--edge);
        border-radius: 12px;
        background: var(--surface);
        color: inherit;
        text-decoration: none;
      }

      .documents a:hover,
      .documents a:focus-visible {
        border-color: var(--brand);
      }

      .document-title {
        display: block;
        font-size: 23px;
        font-weight: 600;
        letter-spacing: -0.01em;
      }

      .document-updated {
        display: block;
        margin-top: 6px;
        color: var(--ink-soft);
        font-size: 15px;
      }

      @media (max-width: 540px) {
        .documents a {
          padding: 20px;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <header>
        <p class="eyebrow">BrainChip Connect</p>
        <h1>Legal</h1>
        <p class="updated">
          The documents below carry the same text as the matching screens inside
          BrainChip Connect.
        </p>
      </header>
      <nav class="documents">
        <a href="privacy-policy.html">
          <span class="document-title">Privacy Policy</span>
          <span class="document-updated"
            >Last updated 25 August 2026</span
          >
        </a>
      </nav>
    </main>
  </body>
</html>
