# Publishes the documentation site to GitHub Pages, which is where Google
# Play's required privacy policy URL points.
#
# Only the built output of `site/` is the website root; other documentation
# is not deployed.
#
# The Privacy Policy page is rendered here rather than taken from the checkout.
# The hosted policy and the screen inside the app are two copies of one text,
# and rendering is what keeps them the same; a run whose render disagrees with
# the committed page fails instead of publishing either version.

name: Publish pages

on:
  push:
    branches: [main]
    paths:
      - 'site/**'
      - 'src/app/content/**'
      - 'src/types/legalContent.ts'
      - 'scripts/render-pages.js'
      - 'scripts/legalMarkdown.js'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

# One deployment at a time, and never cancelled: the site is a URL Play holds,
# so a half-replaced site is worse than a late one.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build the site
    runs-on: ubuntu-latest
    # The job that runs `npm ci`, and so third-party install scripts, can read
    # the repository and nothing else. Publishing rights live in `deploy`,
    # which checks out no code.
    permissions:
      contents: read
      pages: read
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            package-lock.json
            site/package-lock.json

      - name: Install the app's dependencies
        run: npm ci

      - name: Render the legal pages
        run: npm run pages:render

      - name: Check the committed pages match the render
        run: |
          set -eu
          drift=$(git status --porcelain -- site/src/content/docs)
          if [ -n "$drift" ]; then
            echo "::error::The committed legal pages do not match what the renderer produces. Run 'npm run pages:render' and commit the result."
            echo "$drift"
            git diff -- site/src/content/docs
            exit 1
          fi

      - name: Install the site's dependencies
        working-directory: site
        run: npm ci

      - name: Build the site
        working-directory: site
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v6

      - name: Upload the site
        uses: actions/upload-pages-artifact@v5
        with:
          path: site/dist

  deploy:
    name: Publish to GitHub Pages
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
