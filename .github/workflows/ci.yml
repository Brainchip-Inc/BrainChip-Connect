name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Lint, typecheck and test
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: package-lock.json

      - name: Install dependencies
        run: npm ci

      # The three gates below each run and report independently, so a single
      # push surfaces every problem rather than only the first one.
      - name: Lint
        id: lint
        run: npx eslint .

      - name: Typecheck
        id: typecheck
        if: ${{ !cancelled() }}
        run: npx tsc --noEmit

      - name: Test
        id: test
        if: ${{ !cancelled() }}
        run: npx jest
