# Which languages the lint gate checks in this repository.
#
# Remove any language this repo already lints in its own CI. The gates never
# replace or duplicate a lint job that is already working here.
#
# Recognised values: python javascript typescript c cpp bash html css
#
# `javascript` and `typescript` are deliberately absent: the `verify` job in
# .github/workflows/ci.yml already runs `npx eslint .` over the whole project,
# and it stays the single owner of JavaScript and TypeScript as a required check
# on main alongside these gates. Note that it covers linting only. The
# `@react-native` config it extends pulls in `eslint-config-prettier`, which
# just disables the rules that would conflict with prettier, so no
# `prettier/prettier` rule ever runs and JS/TS formatting is unenforced. Adding
# the two languages here would enforce it, but only once the prettier version
# mismatch described below is resolved.
#
# `html` and `css` are absent too. There are none in a React Native app, and the
# gate would reach for prettier 3 while this repo pins prettier 2.8.8 as a
# devDependency, and the two format differently.
#
# `python` is listed for the day a script appears; there is none today and the
# step costs a couple of seconds when nothing matches.
LINT_LANGUAGES="python bash"
